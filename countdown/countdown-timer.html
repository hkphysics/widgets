<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .timer-container {
            text-align: center;
        }
        #time-box {
            font-size: 4rem;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        #start-btn {
            background-color: #4CAF50;
            color: white;
        }
        #start-btn:hover {
            background-color: #45a049;
        }
        #stop-btn {
            background-color: #f44336;
            color: white;
        }
        #stop-btn:hover {
            background-color: #d32f2f;
        }
        #reset-btn {
            background-color: #2196F3;
            color: white;
        }
        #reset-btn:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <label for="time-input" style="display:block; margin-bottom:5px; font-size:0.9rem;">Set time (MM:SS):</label>
        <input type="text" id="time-input" value="01:00" placeholder="MM:SS" inputmode="numeric" style="width:100%; padding:5px; margin-bottom:15px;">
        <div id="time-box">01:00</div>
        <button id="start-btn">Start</button>
        <button id="stop-btn">Stop</button>
        <button id="reset-btn">Reset</button>
    </div>

    <script>
        let timeLeft = 60;
        let intervalId = null;
        const timeBox = document.getElementById('time-box');
        const timeInput = document.getElementById('time-input');

        function updateDisplay() {
            const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const secs = String(timeLeft % 60).padStart(2, '0');
            timeBox.textContent = `${mins}:${secs}`;
        }

        function readInput() {
            const parts = timeInput.value.trim().split(':');
            const total = parts.length === 2
                ? (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0)
                : parseInt(timeInput.value, 10) || 0;
            return total > 0 ? total : 60;
        }

        timeInput.addEventListener('input', () => {
            if (!intervalId) {
                timeLeft = readInput();
                updateDisplay();
            }
        });

        document.getElementById('start-btn').addEventListener('click', () => {
            if (intervalId) return;
            if (timeLeft <= 0) timeLeft = readInput();
            updateDisplay();
            intervalId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(intervalId);
                    intervalId = null;
                }
            }, 1000);
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            clearInterval(intervalId);
            intervalId = null;
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            clearInterval(intervalId);
            intervalId = null;
            timeLeft = readInput();
            updateDisplay();
        });
    </script>
</body>
</html>
