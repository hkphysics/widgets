<!-- Jupyter-notebook countdown-timer widget. Drop this into a notebook cell with `%%html`, or:
from IPython.display import display, HTML
display(HTML(open('countdown-timer-widget.html').read()))
-->
<div class="countdown-timer">
    <style>
        .countdown-timer {
            font-family: Arial, sans-serif;
            max-width: 340px;
            margin: 10px 0;
            padding: 12px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }
        .countdown-timer .timer-box {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            margin: 12px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .countdown-timer button {
            padding: 8px 16px;
            margin: 4px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .countdown-timer #start-btn { background-color: #4CAF50; color: white; }
        .countdown-timer #start-btn:hover { background-color: #45a049; }
        .countdown-timer #stop-btn { background-color: #f44336; color: white; }
        .countdown-timer #stop-btn:hover { background-color: #d32f2f; }
        .countdown-timer #reset-btn { background-color: #2196F3; color: white; }
        .countdown-timer #reset-btn:hover { background-color: #1976D2; }
        .countdown-timer input {
            width: 100%;
            padding: 6px;
            margin: 6px 0 10px;
            box-sizing: border-box;
        }
    </style>
    <label for="time-input" style="display:block; font-size:0.9rem; margin-bottom:4px;">Set time (MM:SS):</label>
    <input type="text" id="time-input" value="01:00" placeholder="MM:SS" inputmode="numeric">
    <div class="timer-box" id="time-box">01:00</div>
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>
    <button id="reset-btn">Reset</button>

    <script>
        (function () {
            const root = document.currentScript ? document.currentScript.parentElement : document;
            const timeBox = root.getElementById('time-box');
            const timeInput = root.getElementById('time-input');
            let timeLeft = 60;
            let intervalId = null;

            function updateDisplay() {
                const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const secs = String(timeLeft % 60).padStart(2, '0');
                timeBox.textContent = `${mins}:${secs}`;
            }

            function readInput() {
                const parts = timeInput.value.trim().split(':');
                const total = parts.length === 2
                    ? (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0)
                    : parseInt(timeInput.value, 10) || 0;
                return total > 0 ? total : 60;
            }

            timeInput.addEventListener('input', () => {
                if (!intervalId) {
                    timeLeft = readInput();
                    updateDisplay();
                }
            });

            root.getElementById('start-btn').addEventListener('click', () => {
                if (intervalId) return;
                if (timeLeft <= 0) timeLeft = readInput();
                updateDisplay();
                intervalId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(intervalId);
                        intervalId = null;
                    }
                }, 1000);
            });

            root.getElementById('stop-btn').addEventListener('click', () => {
                clearInterval(intervalId);
                intervalId = null;
            });

            root.getElementById('reset-btn').addEventListener('click', () => {
                clearInterval(intervalId);
                intervalId = null;
                timeLeft = readInput();
                updateDisplay();
            });
        })();
    </script>
</div>
